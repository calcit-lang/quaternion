name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v6
      with:
        node-version: 20

    - run: corepack enable && corepack prepare yarn@4.12.0 --activate
    - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1.4.0

    - name: Install strict dependencies
      run: caps --calcit-version 0.13.77 --strict --ci

    - name: Verify canonical Snapshot
      run: calcit calcit.cirru edit format && git diff --exit-code -- calcit.cirru

    - name: Check Calcit and static quality
      run: |
        calcit calcit.cirru --check-only
        calcit calcit.cirru analyze check-types --summary-only
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
        calcit calcit.cirru docs check-md README.md --failures-only

    - name: Test native backend
      run: calcit calcit.cirru

    - name: Test JavaScript backend
      run: |
        calcit calcit.cirru js
        yarn install --immutable
        node ./main.mjs
