name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - run: corepack enable && corepack prepare yarn@4.18.0 --activate
    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: 0.1.1

    - name: Install strict dependencies
      run: |
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Verify canonical Snapshot
      run: calcit calcit.cirru edit format && git diff --exit-code --quiet -- calcit.cirru

    - name: Check Calcit and static quality
      run: |
        set -euo pipefail
        calcit calcit.cirru --check-only --all-defs
        calcit calcit.cirru --entry test --check-only
        calcit calcit.cirru --check-only --ns quaternion.complex --ns quaternion.vector --ns quaternion.core --summary-only
        calcit calcit.cirru fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status == "passed" and .diagnostics == [] then true else ., false end'
        calcit calcit.cirru analyze weak-types --summary-only --format json | jq -e '.data.summary.hits == 0'
        calcit calcit.cirru analyze weak-types --only coverage --coverage-level none,partial --summary-only --format json | jq -e '.data.summary.definitions == 0'
        calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'

    - name: Test native backend
      run: calcit calcit.cirru

    - name: Test JavaScript backend
      run: |
        calcit calcit.cirru js
        node ./main.mjs

    - name: Verify assertion failures exit non-zero across backends
      shell: bash
      run: |
        mkdir -p .calcit
        probe_dir="$(mktemp -d .calcit/assertion-probe.XXXXXX)"
        trap 'rm -rf "$probe_dir"' EXIT

        set +e
        timeout 10s calcit calcit.cirru --entry test >"$probe_dir/native.log" 2>&1
        native_status=$?
        set -e
        cat "$probe_dir/native.log"
        if [ "$native_status" -eq 0 ] || [ "$native_status" -eq 124 ]; then
          echo "native assertion probe returned unexpected status: $native_status" >&2
          exit 1
        fi
        grep -q 'Expected-truthy-expression: false' "$probe_dir/native.log"

        calcit calcit.cirru --entry test js
        set +e
        timeout 10s node --input-type=module -e 'import { assertion_failure_probe_$x_ } from "./js-out/quaternion.test.mjs"; assertion_failure_probe_$x_()' >"$probe_dir/js.log" 2>&1
        js_status=$?
        set -e
        cat "$probe_dir/js.log"
        if [ "$js_status" -eq 0 ] || [ "$js_status" -eq 124 ]; then
          echo "JavaScript assertion probe returned unexpected status: $js_status" >&2
          exit 1
        fi
        grep -q 'Expected-truthy-expression: false' "$probe_dir/js.log"
