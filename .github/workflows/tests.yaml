name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24

    - run: corepack enable && corepack prepare yarn@4.18.0 --activate
    - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps

    - name: Install strict dependencies
      run: |
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Verify canonical Snapshot
      run: calcit calcit.cirru edit format && git diff --exit-code -- calcit.cirru

    - name: Check Calcit and static quality
      run: |
        calcit calcit.cirru --strict-types --check-only
        calcit calcit.cirru --entry test --check-only
        calcit calcit.cirru analyze check-types --summary-only
        calcit calcit.cirru analyze check-public --ns quaternion.complex --ns quaternion.vector --ns quaternion.core --summary-only
        calcit calcit.cirru analyze deprecated
        calcit calcit.cirru docs check-md README.md --failures-only

    - name: Test native backend
      run: calcit calcit.cirru

    - name: Test JavaScript backend
      run: |
        calcit calcit.cirru js
        node ./main.mjs

    - name: Verify assertion failures exit non-zero across backends
      shell: bash
      run: |
        mkdir -p .calcit
        probe_dir="$(mktemp -d .calcit/assertion-probe.XXXXXX)"
        trap 'rm -rf "$probe_dir"' EXIT

        set +e
        timeout 10s calcit calcit.cirru --entry test >"$probe_dir/native.log" 2>&1
        native_status=$?
        set -e
        cat "$probe_dir/native.log"
        if [ "$native_status" -eq 0 ] || [ "$native_status" -eq 124 ]; then
          echo "native assertion probe returned unexpected status: $native_status" >&2
          exit 1
        fi
        grep -q 'Expected-truthy-expression: false' "$probe_dir/native.log"

        calcit calcit.cirru --entry test js
        cp -R js-out "$probe_dir/js-out"
        printf '%s\n' \
          'import { assertion_failure_probe_$x_ } from "./js-out/quaternion.test.mjs"' \
          'assertion_failure_probe_$x_()' \
          >"$probe_dir/main.mjs"
        set +e
        (cd "$probe_dir" && timeout 10s node ./main.mjs) >"$probe_dir/js.log" 2>&1
        js_status=$?
        set -e
        cat "$probe_dir/js.log"
        if [ "$js_status" -eq 0 ] || [ "$js_status" -eq 124 ]; then
          echo "JavaScript assertion probe returned unexpected status: $js_status" >&2
          exit 1
        fi
        grep -q 'Expected-truthy-expression: false' "$probe_dir/js.log"
