name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: 'yarn'

    - run: corepack enable && corepack prepare yarn@4.12.0 --activate
    - uses: calcit-lang/setup-calcit@v1

    - name: "test"
      run: caps --ci && calcit calcit.cirru --check-only && calcit calcit.cirru js && yarn install --immutable && node ./main.mjs
